# Render Blueprint: Full-Stack Free Cloud Deployment
# Free tier supports Docker (Playwright + FastAPI) and Node.js (Next.js 16)
services:
  # 1. FastAPI + Playwright Backend Service
  - type: web
    name: automation-testing-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: sqlite:///test_agent.db
      - key: PLAYWRIGHT_HEADLESS
        value: "true"
      - key: PYTHONUNBUFFERED
        value: "1"

  # 2. Next.js 16 Frontend Web Service
  - type: web
    name: automation-testing-frontend
    env: node
    plan: free
    region: oregon
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: automation-testing-backend
          property: host
